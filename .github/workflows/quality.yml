name: Widget quality checks
on:
  pull_request:
    paths: ['widget/**', '.github/workflows/quality.yml']
  push:
    branches: ['main', 'ux/improve-library']
    paths: ['widget/**', '.github/workflows/quality.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: widget
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: widget/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
